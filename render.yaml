# Free resources only. No paid pre-deploy command, disks, jobs or preview stacks.
services:
  - type: web
    name: pulse-demo
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    autoDeployTrigger: "off"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pulse-demo-db
          property: connectionString
      - key: PULSE_HOSTED_DEMO
        value: "true"
      - key: DEMO_AUTH_ENABLED
        value: "true"
      - key: DEMO_AUTH_USERNAME
        sync: false
      - key: DEMO_AUTH_PASSWORD
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DEMO_SEED_ON_START
        value: "true"
      - key: EMAIL_DELIVERY_MODE
        value: mock
      - key: MCP_SERVER_URL
        value: http://127.0.0.1:8001/mcp
      - key: PULSE_CAMPAIGN_RETRIEVAL_SECRET
        generateValue: true
      - key: PULSE_CAMPAIGN_PREVIEW_SECRET
        generateValue: true
databases:
  - name: pulse-demo-db
    plan: free
    region: singapore
    databaseName: pulse
    user: pulse
    postgresMajorVersion: "16"
    ipAllowList: []
