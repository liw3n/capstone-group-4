[project]
name = "pulse-chat-api"
version = "0.1.0"
description = "FastAPI backend for the PULSE chat popup"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "localstack>=2026.8.1",
    "awscli-local>=0.22.2",
    "fastmcp>=4.0.10",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0,<2",
    "openai>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "aws>=0.2.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
