  <rect x="1240" y="766" width="290" height="160" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="1260" y="797" class="heading">GWM Core Email API</text>
  <text x="1260" y="823" class="badge">OPTIONAL SERVER ADAPTER</text>
  <text x="1260" y="851" class="label">Mock delivery is the local default</text>
  <text x="1260" y="878" class="small">Live URL/auth requires API-owner confirmation</text>
  <text x="1260" y="901" class="small">No live company data connection</text>
