  <text x="1205" y="716" class="small">Optional HTTPS</text>
  <text x="58" y="951" class="small">PULSE sends only after stored preview, consent checks and exact adviser confirmation; successful recipients become contact events.</text>
  <rect x="32" y="999" width="1536" height="208" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="58" y="1031" class="badge">TEAM PROVISIONING - make provision - LOCAL EMULATION</text>
  <rect x="60" y="1057" width="285" height="121" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
