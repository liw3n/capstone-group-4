<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1580" viewBox="0 0 1600 1580" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">PULSE system architecture</title>
  <desc id="diagram-description">Current local prototype: a React CRM served by Vite connects to FastAPI chat, contact, campaign and campaign-draft endpoints. The Campaigns workspace includes a prefilled generated-draft review mode with optimistic manual edits, adviser-reviewed dates, selected-field regeneration and a server-verified, short-lived final preview. Explicit confirmation atomically creates one official-schema campaign with draft status and marks the project-owned generation draft confirmed; it does not create contact memberships, activate or send. make dev starts local FastAPI, FastMCP and Vite processes together. Groq provides campaign intent, drafting, bounded active-draft turn classification, narrative options, selected-field revision proposals and tool selection; deterministic server validation owns targeting, state-aware routing, selective draft revision, consent and email confirmation. Active campaign discovery has a dedicated tenant/status query, overlap filters and deterministic date/table rendering; the browser exports the displayed snapshot as XLSX, including restored history. Recommendations use the current Singapore date and send only counts, ten-row previews and an opaque list ID to Groq. Full results stay in adviser-scoped PostgreSQL snapshots for 24 hours; the browser downloads them through FastAPI to generate client XLSX without another model call. FastMCP includes campaign discovery, matching, review-only draft preparation and revision, email preview and confirmed delivery tools. PostgreSQL stores chat, adviser-scoped clarification state, active-draft pointers, generated draft revisions, revision-bound option sets, preview-token digests and confirmation audit state, scoped CRM contacts, campaigns, email batches and contact events. Email delivery is simulated by default; an optional server-side GWM Core Email API adapter is implemented but requires API-owner configuration. Simulated task and pipeline actions remain in the browser. make provision uses Terraform and FakeCloud for local infrastructure and PostgreSQL.</desc>
