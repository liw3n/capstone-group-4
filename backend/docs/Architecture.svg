      .small { font-size: 13px; fill: #64748b; }
      .badge { font-size: 12px; font-weight: 700; fill: #475569; letter-spacing: 0.7px; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2; stroke-linejoin: round; marker-end: url(#arrow); }
      .planned { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#planned-arrow); }
