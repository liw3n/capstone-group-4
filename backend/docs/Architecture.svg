  <text x="88" y="308" class="heading">React CRM + PULSE</text>
  <text x="88" y="333" class="small">Browser application</text>
  <text x="88" y="367" class="label">Contacts / leads / pipeline / tasks</text>
  <text x="88" y="392" class="label">Campaigns / generated-draft review / settings</text>
  <text x="88" y="426" class="small">Contacts: PostgreSQL | tasks/pipeline: React state</text>
