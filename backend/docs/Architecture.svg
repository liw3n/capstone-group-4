  <text x="547" y="380" class="label">Chat + scoped CRM/draft APIs + full-result downloads</text>
  <text x="547" y="405" class="small">Scoped revisions + signed preview + atomic confirmation</text>
  <text x="547" y="424" class="small">Both direct and /api-prefixed route forms</text>
  <path d="M403 637 L450 637 L450 379 L526 379" class="arrow"/>
  <text x="73" y="717" class="small">Chat responses return through the same API path</text>
  <path d="M666 436 L666 494" class="arrow"/>
  <text x="533" y="474" class="small">History + context</text>
