  <text x="545" y="525" class="heading">LLM orchestration</text>
  <text x="545" y="549" class="label">State-aware turns + typed draft artifacts</text>
  <text x="545" y="574" class="label">Tools + 10-client previews</text>
  <text x="545" y="602" class="small">MCP client / request-scoped registry</text>
  <rect x="848" y="494" width="276" height="137" rx="12" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
  <text x="867" y="525" class="heading">FastMCP :8001 /mcp</text>
  <text x="867" y="550" class="label">Tools + shared domain logic</text>
  <text x="867" y="575" class="label">Scoped PostgreSQL data access</text>
  <text x="867" y="602" class="small">Identity lookup / matching / drafts / email</text>
  <path d="M806 563 L848 563" class="arrow"/>
  <text x="526" y="657" class="small">Discovery: frontend ID → tenant + active status + filters + table + XLSX.</text>
  <text x="526" y="678" class="small">FA + tenant metadata is supplied separately from model arguments.</text>
  <rect x="1240" y="323" width="290" height="160" rx="12" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5"/>
